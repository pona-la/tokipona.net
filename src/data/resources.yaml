- name: Wasona
  category: course
  description: "This website offers a full Toki Pona crash-course. It teaches vocabulary, grammar, and the sitelen pona writing system using Duolingo-style quizzes and exercises to boost retention. Available in many languages: English · čeština · dansk · Deutsch · español · français · magyar · italiano · polski · português · Tagalog · русский · українська · العربية · עברית" 
  link: https://wasona.com/
  img: https://wasona.com/favicon.png
- name: sona.pona.la
  category: reference
  description: Toki Pona's community wiki, a gold mine of articles, links and information about language, its community, and its history. Constantly being updated with new information, everyone is invited to contribute.
  link: https://sona.pona.la/
  img: https://static.wikitide.net/sonaponawiki/e/ec/sona_pona_%28provisional%29.png
- name: nimi.li
  category: reference
  description: "An interactive dictionary for Toki Pona that brings together definitions and notes from various sources. It also serves as a reference for various writing systems, the sign language Luka Pona, usage statistics, and more."
  link: https://nimi.li/
  img: https://nimi.li/favicon.png
- name: lipu Linku
  category: reference
  description: "lipu Linku maintains a community-sourced multilingual dictionary and collects other data, including usage data, tracks experimental 'sandbox' words, and also maintains a repository of Sitelen Pona fonts."
  link: https://linku.la/
  img: https://linku.la/favicon.png
- name: lipu pi jan Ne
  category: reference
  description: jan Ne's website is a long-consulted community resource for those interested in Toki Pona as it is presented in Sonja Lang's 2014 publication. It mirrors a copy of the original dictionary and place names, as well as other excerpts from the book and from the creator's early published work.
  link: https://jan-ne.github.io/tp/
  img: https://jan-ne.github.io/janNelaso.svg
- name: SPPTA
  category: reference
  description: "The Sitelen Pona Publishers and Typographers Association outlines Common Sitelen Pona (sitelen pona kulupu), a standard that outlines the basic characteristics of Sitelen Pona, developed through a mix of community surveys and consultations with Sitelen Pona experts. "
  link: https://sitelenpona.net/
  img: /sitelen/resources/sppta.png
- name: lipu Kemeka
  category: reference
  description: "A English-TP dictionary which seeks to demonstrate different ways translation works through contextualized, example sentences. Still under development."
  link: https://kemeka.pona.la/
  img: https://kemeka.pona.la/favicon.svg
- name: "o pilin e toki pona #opetp"
  category: course
  description: Using comprehensible input, jan Telakoman uses pictures and gestures to get you learning Toki Pona subconsciously through immersion. Thirty videos designed to be watched over one month; are you up to the challenge?
  link: https://youtube.com/playlist?list=PLwYL9_SRAk8EXSZPSTm9lm2kD_Z1RzUgm
  img: /sitelen/resources/opetp.png
- name: Learn Toki Pona!
  category: course
  description: In this video series, jan Kekan San teaches introductory Toki Pona alongside its sitelen pona writing system using engaging lectures and a virtual whiteboard. Also, he's a literal star. 
  link: https://www.youtube.com/playlist?list=PLoLQoll2U6WEeCO7C2oc1LTWgkoBC8rvT
  img: /sitelen/resources/munKS.jpg
- name: lipu sona pona
  category: course
  description: Made by jan Lentan in 2021 and translated to German, Spanish, Esperanto, Polish, Portuguese, Russian and Chinese, this text-based course teaches the language's grammar and vocabulary across thirteen lessons and various translation exercises. 
  link: https://lipu-sona.pona.la/
  img: /sitelen/resources/janLentan.png
- name: lipu sona mi pi toki pona
  category: course
  description: A cute, colourful course designed by soweli Sika in 2022. Translated to French, Italian, and Norwegian. 
  link: https://lipu-sona.comforttiger.space/
  img: /sitelen/resources/sowelisika.png
- name: toki pona lessons 
  category: course
  description: a work-in-progress instructional video series in English
  link: https://youtube.com/playlist?list=PLuYLhuXt4HrQwIDV7FBkA8zApw0pnEJrX
  img: 
- name: Toki Pona Curso
  category: course
  description: a video series in Spanish
  link: https://www.youtube.com/watch?v=CDnLcu9gBhI&list=PLPbQ4a2mlRrjs0upWq8umbB1SBA7mFWMU
  img: 
- name: Toki Pona in 18 minutes
  category: course
  description: a short video lesson covering all of Toki Pona's grammar
  link: https://youtube.com/watch?v=5phj5Ae80h8
  img: 
- name: o kama sona e sitelen pona
  category: course
  description: jan Same teaches the Sitelen Pona writing system in 13 video lessons
  link: https://www.youtube.com/watch?v=Uze2LKVN-2E&list=PLJjeLfR6etE69KRFWQB1guBjfWIw8NN75
  img: 
- name: lipu tenpo
  category: reading
  description: A magazine written in Toki Pona with over 30 releases, featuring both informative and creative works. Available in digital and printable formats. Through Patreon, you can get lipu tenpo sent straight to your doorstep! 
  link: https://liputenpo.org/
  img: 
- name: StoryWeaver Picture Books
  category: reading
  description: StoryWeaver offers a bunch of illustrated that anyone can translate into any language; Toki Pona speakers have translated selected titles into Toki Pona!
  link: https://storyweaver.org.in/en/search?language=Toki%20Pona
  img: 
- name: toki soweli tan jan Beatrix Potter
  category: reading
  description: Twenty-two of Beatrix Potter's animal stories translated into Toki Pona by jan Ke Tami and jan Pulepo. 
  link: https://lipumonsuta.neocities.org/
  img: 
- name: Fingtam Toki Pona Stories 
  category: reading
  description: "Three primary works that each tell one story at three times (Beginner, Lower Intermediate, Upper Intermediate). Translated by jan Ne and with audio read-along by jan Po, physical editions of the Fingtam books can be ordered on Amazon, while PDFs are available free online."
  link: https://www.fincxjejo.com/toki-pona-stories
  img: 
- name: Beginner Texts in Toki Pona
  category: reading
  description: A collection of mini to medium to massive works, totalling over 15K+ words of original Toki Pona narratives, featuring literal English translations and Sitelen Pona. Authored by jan Lakuse.
  link: https://raacz.neocities.org/toki-pona/beginner-material
  img: 
- name: utala musi pi toki pona
  category: reading
  description: Website of the annual creative writing competition, features everything from book-length works to short poems. 
  link: https://utala.pona.la
  img: 
- name: lipu monsuta
  category: reading
  description: A Toki Pona horror anthology with five releases. 
  link: https://lipumonsuta.neocities.org/
  img: 
- name: toki lili lon ma kasi
  category: listening
  description: In this short, 12-video series, jan Telakoman vlogs as he walks around in nature. Emojis and other overlaid graphics help support you to understand what he's saying. Also see jan Telakoman's much longer '#opetp' project (listed here under 'courses') which uses the same principles of comprehensible input. 
  link: https://www.youtube.com/playlist?list=PLwYL9_SRAk8E-dYX8ioR3tt91hcd5bxV0
  img: bk
- name: jan Polijan
  category: listening
  description: jan Polijan's vlogs are spoken in clear, unhurried Toki Pona. Each vlog shows him engaging in an activity or musing on a new idea while being surrounded by nature. Supported with strong visual context, jan Polijan's videos all have options for subtitles in Toki Pona, English and French. 
  link: https://www.youtube.com/@janPolijan/videos
  img: /sitelen/resources/polijan.jpg

- name: Duostories
  category: listening
  description: The Duostories project allows you to practice your Toki Pona comprehension with interactive exercises and stories. Text-to-speech narration is integrated into the stories. 
  link: https://duostories.org/tok-en
  img: /sitelen/resources/duostories.png
- name: kalama sin
  category: listening
  description: A Toki Pona podcast. Different speakers come on and present naturally about various topics. Most of the episodes have transcripts to help you follow along. kalama sin is available wherever you get your podcasts, including YouTube, where most episodes have subtitles available.
  link: https://redcircle.com/shows/kalama-sin
  img: /sitelen/resources/kalamasin.jpeg
- name: suno pi toki pona
  category: listening
  description: suno pi toki pona, or Toki Pona Day, is a 24-hour live-stream event held every year in the week of August. On their website, you can peruse the backlog of recordings.
  link: https://suno.pona.la/
  img: /sitelen/resources/sptp.svg
